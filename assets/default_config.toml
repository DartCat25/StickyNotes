# StickyNotes settings.
# Created on the first run, never overwritten afterwards. Missing keys fall
# back to the defaults, unknown keys are ignored.

[sticker]
# Tilt the sticker while it is dragged.
ROTATION_ENABLED = true
# Hinge the tilt at the grabbed point.
ANCHOR_AT_GRAB = false

[text]
# Empty family means the system font.
FAMILY = ""
POINT_SIZE = 12
# 100..900, QFont::Weight.
WEIGHT = 400

[cloner]
# Without the cloner a sticker is created by double clicking the tray icon.
ENABLED = true
# Position of the cloner window, defaults to the bottom right corner of the
# primary screen.
# X = 100
# Y = 100
# Defaults of a new sticker.
COLOR = "#fef5c1"
WIDTH = 300
HEIGHT = 300

[physics]
# How fast the tilt decays, 0..1.
FADE = 0.94
# Tilt strength of horizontal mouse movement.
FORCE = 0.1
# Tilt limit in degrees.
MAX_ANGLE = 30.0
