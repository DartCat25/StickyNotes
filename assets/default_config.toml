# StickyNotes settings.
#
# This file is created on the first run and is never overwritten afterwards.
# Any missing key falls back to its default, unknown keys are ignored.

[sticker]
# Background color of a new sticker and of the cloner.
color = "#fef5c1"
# Reserved: resizing is a separate feature, these values are not applied yet.
width = 300
height = 300
# Tilt the sticker while it is dragged.
rotation_enabled = true

[text]
# Empty family means the system font.
family = ""
point_size = 12
# 100..900, same as QFont::Weight.
weight = 400

[cloner]
# The cloner creates stickers by dragging. Without it a sticker is created by
# double clicking the tray icon.
enabled = true
# Position of the cloner window. Uncomment both keys to pin it, otherwise the
# cloner sits in the bottom right corner of the primary screen.
# x = 100
# y = 100
# The sticker hangs from the point it was grabbed by, not from its center.
anchor_at_grab = true

[physics]
# How fast the tilt decays: 0..1, 1 means it never decays.
fade = 0.94
# How strongly horizontal mouse movement tilts the sticker.
force = 0.1
# Tilt limit in degrees.
max_angle = 30.0
