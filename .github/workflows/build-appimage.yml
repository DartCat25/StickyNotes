name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            curl \
            file \
            libgl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxext-dev \
            patchelf \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools

      - name: Cache AppImage tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/stickynotes-appimage-tools
          key: appimage-tools-${{ runner.os }}-${{ hashFiles('packaging/install-appimage-tools.sh') }}

      - name: Build AppImage
        timeout-minutes: 15
        run: ./packaging/build-appimage.sh

      - name: Create checksum
        run: sha256sum dist/*.AppImage > dist/SHA256SUMS.txt

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-AppImage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
